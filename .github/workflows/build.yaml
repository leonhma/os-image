name: build new image
on:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
      - name: login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: build
        run: |
          podman build -t "ghcr.io/${{ github.repository }}:${{ github.sha }}" \
            -t "ghcr.io/${{ github.repository }}:latest" \
            -l "org.opencontainers.image.revision=${{ github.sha }}" \
            -l "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            -l "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .
